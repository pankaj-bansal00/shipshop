<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

/* General styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    color: #333;
    

}

h1 {
    text-align: center;
    margin: 20px 0;
    color: #555;
}

/* Product container */
.product {
    background: #fff;
    border: 1px solid #ddd; 
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    margin: 15px auto;
    width: 300px; /* Fixed width for the product card */
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
}

.product:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

/* Product image */
.product img {
    max-height: 150px;
    max-width: 150px;
    margin-bottom: 10px;
    border-radius: 8px;
    object-fit: cover;
}

/* Product heading */
.product h4 {
    font-size: 1.2em;
    margin: 10px 0;
    color: #222;
}

/* Product details */
.product .details {
    margin-top: 10px;
    font-size: 0.9em;
    color: #666;
}

/* Price emphasis */
.product .details p:nth-of-type(2) {
    font-size: 1.1em;
    font-weight: bold;
    color: #007b5e;
}

/* View Details link */
.product a {
    display: inline-block;
    text-decoration: none;
    padding: 8px 16px;
    margin-top: 10px;
    color: #fff;
    background-color: #007b5e;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}

.product a:hover {
    background-color: #005f47;
}


/* Responsive Design */
@media (max-width: 768px) {
    .product {
        width: calc(50% - 20px); /* Two products per row on medium screens */
    }
}

@media (max-width: 480px) {
    .product {
        width: 100%; /* One product per row on small screens */
    }
}
</style>


</head>
<body>
    
    {% include 'base/nav.html' %}
    <h1>Products by Category {{ category.name }}</h1>
  
    {% for product in products %}
        <div class="product">
            <div class="img"><img src="{{ product.photo.url }}" alt="{{ product.name }}"></div>
          <div class="heading">  <h4>{{ product.name }}</h4></div>
            <div class="details"> 
                <p>{{ product.description|linebreaksbr }}</p>
                <p>₹{{ product.price }}</p>
                <a href="{% url 'product_detail' product.Productid %}"> View Details</a></div>
            
        </div>
    {% endfor %}
    {% include 'base/footer.html' %}
</body>
</html>
