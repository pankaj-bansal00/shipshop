<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/store/content.css">
  <title>Document</title>
</head>

<body>

  <section class="hero">
    <!-- Slide 1 -->
    <div class="slide fade">
      <img src="slide1.jpg" alt="Slide 1">
      <div class="caption">Up to 50% Off on Clothing</div>
    </div>

    <!-- Slide 2 -->
    <div class="slide fade">
      <img src="slide2.jpg" alt="Slide 2">
      <div class="caption">Exclusive Accessories Collection</div>
    </div>

    <!-- Slide 3 -->
    <div class="slide fade">
      <img src="slide3.jpg" alt="Slide 3">
      <div class="caption">New Arrivals in Electronics</div>
    </div>
  </section>
  <div class="category_container">
    {% for category in Categorys %}
    <div>
      <img src="{{ category.image.url }}" alt="">

      <h1><a href="{% url 'category' category.slug %}">{{ category.name }} </a></h1>

    </div>
    {% endfor %}

  </div>


</body>

</html>
